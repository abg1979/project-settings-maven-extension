name: Validate Central Publisher credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require master branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Credential validation must be dispatched from master."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - name: Set up Maven Central credentials
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}

      - name: Set up Maven
        uses: jdx/mise-action@v5.1.1
        with:
          install_args: maven@
          env: false

      - name: Test Maven-resolved Central credentials
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: MAVEN_SETTINGS_FILE="$HOME/.m2/settings.xml" bash scripts/validate-central-credentials.sh
