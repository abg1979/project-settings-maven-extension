name: Validate Central Publisher credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require master branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Credential validation must be dispatched from master."
            exit 1
          fi

      - name: Test Central Publisher API authentication
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import urllib.error
          import urllib.request

          username = os.environ.get("OSSRH_USERNAME")
          password = os.environ.get("OSSRH_TOKEN")
          if not username or not password:
              raise SystemExit("::error::OSSRH_USERNAME or OSSRH_TOKEN is missing or empty.")

          token = base64.b64encode(f"{username}:{password}".encode()).decode()
          request = urllib.request.Request(
              "https://central.sonatype.com/api/v1/publisher/deployments",
              headers={"Authorization": f"Bearer {token}"},
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              status = error.code
              error.close()
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("::error::Could not reach the Central Publisher Portal API.")

          if status == 200:
              print("Central accepted the credentials (HTTP 200). This confirms API authentication, not namespace publishing permission.")
          elif status == 401:
              raise SystemExit("::error::Central rejected the credentials (HTTP 401). Check that OSSRH_USERNAME and OSSRH_TOKEN contain the Portal token username and password.")
          elif status == 403:
              raise SystemExit("::error::Central denied access (HTTP 403). Check the Portal account's access.")
          else:
              raise SystemExit(f"::error::Unexpected Central Publisher API response: HTTP {status}.")
          PY
