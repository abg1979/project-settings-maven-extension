name: Validate Central Publisher credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require master branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Credential validation must be dispatched from master."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - name: Set up Maven Central credentials
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}

      - name: Set up Maven
        uses: jdx/mise-action@v5.1.1
        with:
          install_args: maven@
          env: false

      - name: Test Maven-resolved Central credentials
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: |
          effective_settings="$RUNNER_TEMP/effective-settings.xml"
          trap 'rm -f "$effective_settings"' EXIT
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-settings \
            -DshowPasswords=true \
            "-Doutput=$effective_settings"

          python3 - "$effective_settings" <<'PY'
          import base64
          import sys
          import xml.etree.ElementTree as ET
          import urllib.error
          import urllib.request

          try:
              settings = ET.parse(sys.argv[1])
          except (ET.ParseError, OSError):
              raise SystemExit("::error::Could not read Maven's effective settings output.")

          namespace = settings.getroot().tag.rsplit("}", 1)[0] + "}" if "}" in settings.getroot().tag else ""
          server = next(
              (element for element in settings.findall(f".//{namespace}server")
               if element.findtext(f"{namespace}id") == "central"),
              None,
          )
          if server is None:
              raise SystemExit("::error::Maven's effective settings do not contain server id 'central'.")

          username = server.findtext(f"{namespace}username")
          password = server.findtext(f"{namespace}password")
          if not username or not password or "${" in username or "${" in password:
              raise SystemExit("::error::Maven did not resolve the Central credentials from the generated settings.")

          token = base64.b64encode(f"{username}:{password}".encode()).decode()
          request = urllib.request.Request(
              "https://central.sonatype.com/api/v1/publisher/deployments",
              headers={"Authorization": f"Bearer {token}"},
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              status = error.code
              error.close()
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("::error::Could not reach the Central Publisher Portal API.")

          if status == 200:
              print("Central accepted the credentials resolved by Maven from its effective settings (HTTP 200). This confirms API authentication, not namespace publishing permission.")
          elif status == 401:
              raise SystemExit("::error::Central rejected the credentials resolved by Maven (HTTP 401). Check that OSSRH_USERNAME and OSSRH_TOKEN contain the Portal token username and password.")
          elif status == 403:
              raise SystemExit("::error::Central denied access (HTTP 403). Check the Portal account's access.")
          else:
              raise SystemExit(f"::error::Unexpected Central Publisher API response: HTTP {status}.")
          PY
