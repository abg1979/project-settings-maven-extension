name: Validate Central Publisher credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require master branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Credential validation must be dispatched from master."
            exit 1
          fi

      - name: Set up Maven Central credentials
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}

      - name: Test credentials from generated Maven settings
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import urllib.error
          import urllib.request

          settings_path = Path.home() / ".m2" / "settings.xml"
          try:
              settings = ET.parse(settings_path)
          except (ET.ParseError, OSError):
              raise SystemExit("::error::Could not read the settings.xml generated by setup-java.")

          namespace = settings.getroot().tag.rsplit("}", 1)[0] + "}" if "}" in settings.getroot().tag else ""
          server = next(
              (element for element in settings.findall(f".//{namespace}server")
               if element.findtext(f"{namespace}id") == "central"),
              None,
          )
          if server is None:
              raise SystemExit("::error::Generated Maven settings do not contain server id 'central'.")

          username_reference = server.findtext(f"{namespace}username")
          password_reference = server.findtext(f"{namespace}password")
          if username_reference != "${env.MAVEN_USERNAME}" or password_reference != "${env.MAVEN_PASSWORD}":
              raise SystemExit("::error::Generated Maven settings do not reference the expected credential environment variables.")

          username = os.environ.get(username_reference[6:-1])
          password = os.environ.get(password_reference[6:-1])
          if not username or not password:
              raise SystemExit("::error::Maven Central credential environment variables are missing or empty.")

          token = base64.b64encode(f"{username}:{password}".encode()).decode()
          request = urllib.request.Request(
              "https://central.sonatype.com/api/v1/publisher/deployments",
              headers={"Authorization": f"Bearer {token}"},
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              status = error.code
              error.close()
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("::error::Could not reach the Central Publisher Portal API.")

          if status == 200:
              print("Central accepted the credentials resolved from Maven settings (HTTP 200). This confirms API authentication, not namespace publishing permission.")
          elif status == 401:
              raise SystemExit("::error::Central rejected the credentials resolved from Maven settings (HTTP 401). Check that OSSRH_USERNAME and OSSRH_TOKEN contain the Portal token username and password.")
          elif status == 403:
              raise SystemExit("::error::Central denied access (HTTP 403). Check the Portal account's access.")
          else:
              raise SystemExit(f"::error::Unexpected Central Publisher API response: HTTP {status}.")
          PY
