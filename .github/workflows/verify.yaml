name: Verify

# trigger on push to branches and PR
on:
  push:
  pull_request:

jobs:
  build:
    name: 'with JDK ${{ matrix.jdk }}'
    strategy:
      fail-fast: false
      matrix:
        jdk: [ 21 ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '${{ matrix.jdk }}'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: jdx/mise-action@v5.1.1
        with:
          install_args: maven@
          env: false

      - name: import-gpg-key
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASS_PHRASE }}
          trust_level: 5

      - name: list-gpg-secret-keys
        run: gpg --list-secret-keys --keyid-format=long

      - name: Build and verify
        run: mvn verify --batch-mode --no-transfer-progress --errors
