name: Publish package to the Maven Central Repository
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Set up Maven
        uses: jdx/mise-action@v5.1.1
        with:
          install_args: maven@
          env: false

      - name: import-gpg-key
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASS_PHRASE }}
          trust_level: 5

      - name: list-gpg-secret-keys
        run: gpg --list-secret-keys --keyid-format=long

      - name: Configure Git user
        run: |
          git config user.email "oss@carbonbulls.com"
          git config user.name "GitHub Actions"

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2.8.1
        with:
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Publish package
        run: mvn --no-transfer-progress --batch-mode release:prepare release:perform
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
